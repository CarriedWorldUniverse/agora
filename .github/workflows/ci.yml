name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # agora is a TUI on top of bubbletea; the unit tests are
        # platform-agnostic. Linux + macOS cover the production deploys;
        # Windows is gated behind the same ConPTY work as acp-claude-pty
        # so skip until that path lands.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: gofmt (lint)
        if: runner.os != 'Windows'
        run: |
          # Capture stdout AND stderr: gofmt reports drift on stdout but parse
          # errors on stderr (exit 2) — stdout-only would pass a broken file.
          if ! out="$(gofmt -l . 2>&1)" || [ -n "$out" ]; then
            echo "gofmt failed or found drift:"; echo "$out"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...
