name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # agora is a TUI on top of bubbletea; the unit tests are
        # platform-agnostic. Linux + macOS cover the production deploys;
        # Windows is gated behind the same ConPTY work as acp-claude-pty
        # so skip until that path lands.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: gofmt (lint)
        if: runner.os != 'Windows'
        run: |
          drift="$(gofmt -l .)"
          if [ -n "$drift" ]; then echo "gofmt drift:"; echo "$drift"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...
