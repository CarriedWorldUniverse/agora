name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # agora had NO vulnerability gate until 2026-07-25. GO-2026-5970 (a
  # reachable infinite loop in x/text/unicode/norm) sat in go.mod for weeks
  # and was found only because nexus — which does have this gate — tripped on
  # the same dependency. Nothing in this repo would ever have said so.
  security:
    name: security scan
    runs-on: ubuntu-latest
    env:
      GOVULNCHECK_VERSION: v1.3.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}

      - name: govulncheck (symbol-level gate)
        run: ./scripts/govulncheck-gate.sh

  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # agora is a TUI on top of bubbletea; the unit tests are
        # platform-agnostic. Linux + macOS cover the production deploys;
        # Windows is gated behind the same ConPTY work as acp-claude-pty
        # so skip until that path lands.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: gofmt (lint)
        if: runner.os != 'Windows'
        run: |
          # Capture stdout AND stderr: gofmt reports drift on stdout but parse
          # errors on stderr (exit 2) — stdout-only would pass a broken file.
          if ! out="$(gofmt -l . 2>&1)" || [ -n "$out" ]; then
            echo "gofmt failed or found drift:"; echo "$out"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...
